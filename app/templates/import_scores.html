<!DOCTYPE html>
<html>
{% include "_head.html" %}
<body id="page-import-scores">

{% include "_header_nav.html" %}

<div class="content">
	<div class="empty-state">
		<h2>Import day scores</h2>
		<p>Select a CSV with a date and a score per row (a header row, if present, is detected automatically). Each date is matched to an existing journal entry - dates with no matching entry are skipped.</p>
		<form method="post" action="/import_scores" enctype="multipart/form-data">
			<input type="file" name="scores_file" accept="text/csv,.csv" required>
			<button type="submit">Import</button>
		</form>
	</div>
</div>
</body>
</html>
