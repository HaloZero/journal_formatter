<!DOCTYPE html>
<html>
{% include "_head.html" %}
<body id="page-analyze">
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='stylesheets/analyze.css') }}">
<script src="{{ url_for('static', filename='javascript/analyze.js') }}"></script>

{% include "_header_nav.html" %}

<div class="content">
	{% if error %}
		<div class="empty-state">
			<h2>Import didn't run</h2>
			<p>{{ error }}</p>
			<p><a href="/import">Try again</a></p>
		</div>
	{% else %}
		<div class="thread" data-thread="{{ thread_id }}">
			<div class="progress-container">
				<h1>Starting Processing</h1>
				<h3>Processing ...</h3>
			</div>
			<progress id="analysis-progress" value="0" max="100">0% </progress>
		</div>
	{% endif %}
</div>
</body>
</html>
