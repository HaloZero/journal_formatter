<div class="date-range-nav">
    <span>From:</span>
    <input type="month" name="start" value="{{ start_of_range.strftime('%Y-%m') }}"
        {% if years %}min="{{ years[0] }}-01" max="{{ years[-1] }}-12"{% endif %}>

    <span>To:</span>
    <input type="month" name="end" value="{{ end_of_range.strftime('%Y-%m') }}"
        {% if years %}min="{{ years[0] }}-01" max="{{ years[-1] }}-12"{% endif %}>

    <button id="submit">Go</button>
</div>
