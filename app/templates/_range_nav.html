<div style='padding-bottom:15px'>
    <span>Start Date:</span>
    <input type="date" name="start_date" value="{{ start_of_range.strftime('%Y-%m-%d') }}" min="{{ min_date }}" max="{{ max_date }}">
</div>

<div style='padding-bottom:15px'>
    <span>End Date:</span>
    <input type="date" name="end_date" value="{{ end_of_range.strftime('%Y-%m-%d') }}" min="{{ min_date }}" max="{{ max_date }}">
</div>

<button id="submit">Go</button>
